name: GraphLMS quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/web/package-lock.json
      - run: npm ci
      - run: npm run content:check
      - run: npm test -- --run
      - run: npx tsc --noEmit
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/api/package-lock.json
      - run: npm ci
      - run: npm run build

  grader:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/grader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: site/grader/go.sum
      - run: go test ./...
