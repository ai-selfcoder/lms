<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base grid" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;padding:24px;background:var(--bg-canvas);display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
 .col{display:flex;flex-direction:column;align-items:center;gap:6px}
 .bar{background:var(--accent);border-radius:2px;width:100%}
 .box{display:flex;align-items:flex-end;height:80px}
 .n{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)}
</style></head><body>
 <div class="col"><div class="box"><div class="bar" style="height:var(--space-2);width:20px"></div></div><span class="n">2 · 4</span></div>
 <div class="col"><div class="box"><div class="bar" style="height:var(--space-3);width:20px"></div></div><span class="n">3 · 8</span></div>
 <div class="col"><div class="box"><div class="bar" style="height:var(--space-5);width:20px"></div></div><span class="n">5 · 16</span></div>
 <div class="col"><div class="box"><div class="bar" style="height:var(--space-7);width:20px"></div></div><span class="n">7 · 24</span></div>
 <div class="col"><div class="box"><div class="bar" style="height:var(--space-8);width:20px"></div></div><span class="n">8 · 32</span></div>
 <div class="col"><div class="box"><div class="bar" style="height:var(--space-10);width:20px"></div></div><span class="n">10 · 48</span></div>
 <div class="col"><div class="box"><div class="bar" style="height:var(--space-11);width:20px"></div></div><span class="n">11 · 64</span></div>
 <div class="col"><div class="box"><div class="bar" style="height:var(--space-12);width:20px"></div></div><span class="n">12 · 80</span></div>
</body></html>
