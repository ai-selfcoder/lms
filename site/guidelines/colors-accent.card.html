<!-- @dsCard group="Colors" viewport="700x150" name="Accent — Base blue" subtitle="The single expressive accent (#276EF1) and its dark-UI ramp" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;padding:20px;background:var(--bg-canvas);display:flex;gap:10px;flex-wrap:wrap}
 .sw{flex:1;min-width:78px;height:96px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
 .n{font-family:var(--font-mono);font-size:11px;color:#fff;mix-blend-mode:difference}
 .h{font-family:var(--font-mono);font-size:10px;color:#fff;mix-blend-mode:difference;opacity:.7}
</style></head><body>
 <div class="sw" style="background:var(--blue-50)"><span class="n">50</span></div>
 <div class="sw" style="background:var(--blue-100)"><span class="n">100</span></div>
 <div class="sw" style="background:var(--blue-300)"><span class="n">300</span></div>
 <div class="sw" style="background:var(--blue-400)"><span class="n">400</span><span class="h">hover</span></div>
 <div class="sw" style="background:var(--blue-500);box-shadow:var(--glow-accent)"><span class="n">500</span><span class="h">#276EF1</span></div>
 <div class="sw" style="background:var(--blue-600)"><span class="n">600</span><span class="h">pressed</span></div>
 <div class="sw" style="background:var(--blue-700)"><span class="n">700</span></div>
 <div class="sw" style="background:var(--blue-900)"><span class="n">900</span></div>
</body></html>
