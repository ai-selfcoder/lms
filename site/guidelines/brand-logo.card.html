<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;padding:24px;background:var(--bg-canvas);display:flex;gap:32px;align-items:center}
 .mark{display:inline-flex;align-items:center;gap:11px;font-family:var(--font-sans);font-weight:600;letter-spacing:-.02em}
 .tag{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);line-height:20px}
 .accent{color:var(--accent-text)}
 .sep{width:1px;height:90px;background:var(--border-subtle)}
</style></head><body>
 <div style="display:flex;flex-direction:column;gap:16px">
  <span class="mark" style="font-size:28px;color:var(--text-primary)">
   <svg width="34" height="34" viewBox="0 0 28 28"><rect width="28" height="28" rx="7" fill="var(--accent)"/><path d="M8 10.5h7.5a3.5 3.5 0 0 1 0 7H10l2.4-2.4M8 17.5h-.5" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="8" cy="10.5" r="1.4" fill="#fff"/></svg>
   goroutine<span class="accent">.</span>
  </span>
  <span class="mark" style="font-size:18px;color:var(--text-primary);opacity:.85">
   <svg width="22" height="22" viewBox="0 0 28 28"><rect width="28" height="28" rx="7" fill="var(--text-primary)"/><path d="M8 10.5h7.5a3.5 3.5 0 0 1 0 7H10l2.4-2.4M8 17.5h-.5" stroke="var(--bg-canvas)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
   goroutine<span style="color:var(--text-tertiary)">.</span>
  </span>
 </div>
 <div class="sep"></div>
 <div class="tag">
  // тон: по-инженерному строго, плотно, без воды<br>
  // обращение на «ты», нижний регистр в акцентах<br>
  // голос продукта: <span class="accent">читай → решай → прогоняй → разбирай</span>
 </div>
</body></html>
