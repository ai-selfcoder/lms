# Judge0 configuration for the Go concurrency trainer.
# Limits are raised because `go test -race` compilation + execution is heavy.
# See https://github.com/judge0/judge0 for the full list of options.

################################################################################
# Postgres (must match the db service in docker-compose.yml)
################################################################################
POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0pass

################################################################################
# Redis (must match the redis service)
################################################################################
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0redis

################################################################################
# Authentication (optional). If set, the grader must send X-Auth-Token via
# JUDGE0_AUTH_TOKEN. Left blank here for a private internal network.
################################################################################
# AUTHN_TOKEN=
# AUTHZ_TOKEN=

################################################################################
# Resource limits — RAISED for race builds.
# These are the *maximum* values a submission may request; the grader sends its
# own per-submission values (cpu 35s / wall 40s / mem 1 GiB) within these caps.
################################################################################
# CPU time (seconds)
CPU_TIME_LIMIT=60
MAX_CPU_TIME_LIMIT=120
# Extra CPU time grace
CPU_EXTRA_TIME=5
MAX_CPU_EXTRA_TIME=10
# Wall-clock time (seconds) — must exceed CPU limit for a heavy race build
WALL_TIME_LIMIT=60
MAX_WALL_TIME_LIMIT=120
# Memory (KB) — 1.5 GiB cap; race-instrumented binaries use a lot
MEMORY_LIMIT=1572864
MAX_MEMORY_LIMIT=2097152
# Stack (KB)
STACK_LIMIT=128000
MAX_STACK_LIMIT=256000
# Max processes/threads — the Go scheduler + race runtime spawn many threads
MAX_PROCESSES_AND_OR_THREADS=256
MAX_MAX_PROCESSES_AND_OR_THREADS=512
# Allow the language's compile step to also use generous limits
ENABLE_COMPILER_OPTIONS=true
MAX_FILE_SIZE=131072
MAX_MAX_FILE_SIZE=262144
# Output size (KB) — verbose `-test.v` output
MAX_NUMBER_OF_RUNS=1
NUMBER_OF_RUNS=1

################################################################################
# Network — OFF. Untrusted code must not reach the network.
################################################################################
ENABLE_NETWORK=false
# Submissions may NOT re-enable it.
ALLOW_ENABLE_NETWORK=false

################################################################################
# Sandbox hardening
################################################################################
ENABLE_WAIT_RESULT=true
ENABLE_BATCHED_SUBMISSIONS=true
MAX_SUBMISSION_BATCH_SIZE=20
ENABLE_CALLBACKS=false
MAINTENANCE_MODE=false
