<!-- @dsCard group="Components" viewport="700x360" name="CodeBlock & Terminal" subtitle="Go syntax block + the test-runner console" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style> body { margin:0; padding:24px; background:var(--bg-canvas); } </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { CodeBlock, Terminal } = window.GoroutineGoConcurrencyTrainerDesignSystem_634a70;
const code = `func worker(id int, jobs <-chan int, results chan<- int) {
\tfor j := range jobs {
\t\tresults <- j * 2 // обработка
\t}
}`;
const passOut = `$ go test -race ./...
=== RUN   TestWorkerPool
--- PASS: TestWorkerPool (0.42s)
ok      concurrency/workerpool  1.84s`;
const failOut = `$ go test -race ./...
=== RUN   TestWorkerPool
    pool_test.go:41: ожидалось 90, получено 48
--- FAIL: TestWorkerPool (0.31s)
FAIL    concurrency/workerpool  0.93s`;
function App(){return (<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
  <CodeBlock filename="worker_pool.go" code={code} highlightLines={[3]}/>
  <div style={{display:'grid',gap:12}}>
    <Terminal status="pass" output={passOut} duration="1.84s" height={92}/>
    <Terminal status="fail" output={failOut} duration="0.93s" height={92}/>
  </div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
