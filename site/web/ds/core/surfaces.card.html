<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style> body { margin:0; padding:24px; background:var(--bg-canvas); } .lbl{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-tertiary);margin:0 0 8px} </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Card, SegmentedControl, ProgressBar, Badge } = window.GoroutineGoConcurrencyTrainerDesignSystem_634a70;
function App(){
  const [tab,setTab]=React.useState('theory');
  return (<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
    <Card interactive>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <span style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--text-tertiary)'}}>Топик 07</span>
        <Badge variant="count">10 задач</Badge>
      </div>
      <div style={{fontSize:16,fontWeight:600,marginBottom:14,color:'var(--text-primary)'}}>Воркер-пулы и конвейеры</div>
      <ProgressBar value={6} max={10} showLabel label="6/10" tone="success"/>
    </Card>
    <div>
      <p className="lbl">Segmented</p>
      <SegmentedControl value={tab} onChange={setTab} options={[
        {value:'cond',label:'Условие'},
        {value:'theory',label:'Теория'},
        {value:'sol',label:'Решение',locked:true},
      ]}/>
      <p className="lbl" style={{marginTop:20}}>Progress</p>
      <ProgressBar value={12} max={32} showLabel label="12/32" tone="accent" style={{marginBottom:12}}/>
      <ProgressBar value={3} max={32} showLabel tone="warning" size="sm"/>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
