<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style> body { margin:0; padding:24px; background:var(--bg-canvas); } .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px} .lbl{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-tertiary);width:100%;margin:0 0 2px} </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button } = window.GoroutineGoConcurrencyTrainerDesignSystem_634a70;
const Play = <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor" stroke="none"/></svg>;
const Arrow = <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>;
function App(){return (<>
  <p className="lbl">Hierarchy</p>
  <div className="row">
    <Button hierarchy="accent" iconLeft={Play}>Запустить тесты</Button>
    <Button hierarchy="primary">Начать</Button>
    <Button hierarchy="secondary">Сбросить</Button>
    <Button hierarchy="ghost" iconRight={Arrow}>Дальше</Button>
    <Button hierarchy="danger">Удалить прогресс</Button>
  </div>
  <p className="lbl">Size</p>
  <div className="row">
    <Button size="sm">Small</Button>
    <Button size="md">Medium</Button>
    <Button size="lg" iconLeft={Play}>Large</Button>
  </div>
  <p className="lbl">State</p>
  <div className="row">
    <Button loading>Выполняется</Button>
    <Button disabled>Disabled</Button>
    <Button hierarchy="secondary" iconOnly aria-label="run"><span style={{display:'inline-flex'}}>{Play}</span></Button>
  </div>
</>);}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
