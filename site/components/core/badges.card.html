<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style> body { margin:0; padding:24px; background:var(--bg-canvas); } .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px} .lbl{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-tertiary);width:100%;margin:0 0 2px} </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Badge, Kbd } = window.GoroutineGoConcurrencyTrainerDesignSystem_634a70;
function App(){return (<>
  <p className="lbl">Status</p>
  <div className="row">
    <Badge variant="status" tone="pass">PASS</Badge>
    <Badge variant="status" tone="fail">FAIL</Badge>
    <Badge variant="status" tone="timeout">TIMEOUT</Badge>
    <Badge variant="status" tone="info">Выполняется</Badge>
    <Badge variant="status" tone="neutral">Не начато</Badge>
  </div>
  <p className="lbl">Difficulty</p>
  <div className="row">
    <Badge variant="difficulty" tone="easy">easy</Badge>
    <Badge variant="difficulty" tone="medium">medium</Badge>
    <Badge variant="difficulty" tone="hard">hard</Badge>
    <Badge variant="count">4 задачи</Badge>
    <Badge variant="count" tone="info">review</Badge>
  </div>
  <p className="lbl">Keyboard</p>
  <div className="row">
    <span style={{display:'inline-flex',gap:4}}><Kbd>⌘</Kbd><Kbd>↵</Kbd></span>
    <span style={{color:'var(--text-tertiary)',fontSize:13}}>запустить тесты</span>
    <span style={{display:'inline-flex',gap:4,marginLeft:16}}><Kbd>⌘</Kbd><Kbd>K</Kbd></span>
    <span style={{color:'var(--text-tertiary)',fontSize:13}}>поиск задач</span>
  </div>
</>);}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
